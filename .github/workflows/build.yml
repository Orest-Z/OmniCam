name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  # SignPath reads the workflow run and its artifacts to verify where the signed files came from.
  actions: read
  # Build provenance: a signed attestation that the installer was built here, from this commit.
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # Full history and tags: the release steps read them to tell whether this version has
          # been released yet and to list the commits when CHANGELOG.md has no section for it.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The app version lives in apps/desktop/package.json: it names the installer, goes into
      # latest.yml and is what the in-app updater compares against. Releasing follows it — a build
      # of main that carries a version with no release yet publishes one (and creates its tag);
      # pushing a v* tag does the same and must match the file.
      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $pushed = $env:GITHUB_REF -replace '^refs/tags/', ''
            if ($pushed -ne $tag) {
              throw "Tag $pushed does not match apps/desktop/package.json ($version). Bump the version first: the installer and latest.yml would carry $version."
            }
          } elseif ($env:GITHUB_REF -ne 'refs/heads/main') {
            Write-Host "Not main and not a tag - build only."
            "release=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          gh release view $tag 1>$null 2>$null
          $released = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($released) {
            Write-Host "$tag is already released - build only. Bump the version in apps/desktop/package.json to publish a new one."
            "release=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "This build publishes $tag."
            "release=true" >> $env:GITHUB_OUTPUT
          }
          exit 0

      # N-API addon (Electron ABI) + DirectShow filter DLLs, x64 and x86. Needs the VS 2022 C++
      # toolset and CMake, both preinstalled on windows-latest.
      - name: Native build
        run: npm run native:build

      # Releases are code-signed through SignPath (free certificate for open source, key held on their
      # HSM) once the repository variable SIGNPATH_ORGANIZATION_ID is set; every other build, and every
      # build before that, is unsigned. Signing needs a manual approval in SignPath for each request.
      - name: Signing
        id: signing
        shell: pwsh
        run: |
          $enabled = '${{ steps.version.outputs.release }}' -eq 'true' -and '${{ vars.SIGNPATH_ORGANIZATION_ID }}' -ne ''
          "enabled=$($enabled.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($enabled) { Write-Host 'This release is signed: approve both requests in SignPath when they appear.' }

      - name: Installer
        if: steps.signing.outputs.enabled != 'true'
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Signed installer, inside out: sign the app's own binaries, build the installer from the signed
      # directory, sign the installer, then rewrite latest.yml and the blockmap (they describe the file
      # the updater downloads, and signing changed it). See apps/desktop/build/signing.mjs.
      - name: Package app (signed build)
        if: steps.signing.outputs.enabled == 'true'
        run: |
          npm run build
          cd apps/desktop
          npx electron-builder --win dir --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload app for signing
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-app
          path: apps/desktop/release/win-unpacked
          retention-days: 1
          if-no-files-found: error

      - name: Sign app
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          # Waits for the manual approval in SignPath.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: apps/desktop/release/signed-app

      - name: Build installer from the signed app
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/desktop
        run: |
          node build/signing.mjs app-update-yml release/signed-app
          npx electron-builder --win nsis --prepackaged release/signed-app --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer for signing
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-installer
          path: apps/desktop/release/*.exe
          retention-days: 1
          if-no-files-found: error

      - name: Sign installer
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: apps/desktop/release/signed-installer

      - name: Use the signed installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        working-directory: apps/desktop
        run: |
          Get-ChildItem release/signed-installer/*.exe | Copy-Item -Destination release -Force
          node build/signing.mjs refresh-latest release
          $sig = Get-AuthenticodeSignature (Get-ChildItem release/OmniCam-Setup-*.exe)
          if ($sig.Status -ne 'Valid') { throw "Installer signature is $($sig.Status): $($sig.StatusMessage)" }
          Write-Host "Signed by: $($sig.SignerCertificate.Subject)"

      - uses: actions/upload-artifact@v5
        with:
          name: OmniCam-Setup-${{ steps.version.outputs.version }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

      # Anyone can check that a downloaded installer came from this workflow and commit:
      #   gh attestation verify OmniCam-Setup-<version>.exe --repo Orest-Z/OmniCam
      - name: Attest build provenance
        if: steps.version.outputs.release == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: apps/desktop/release/OmniCam-Setup-*.exe

      # Release notes: the CHANGELOG section for this version, or the commits since the previous
      # tag if it has none, followed by the download instructions.
      - name: Release notes
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $changelog = [regex]::Match(
            (Get-Content CHANGELOG.md -Raw -Encoding utf8),
            "(?ms)^##\s+$([regex]::Escape($version))\b.*?(?=^##\s|\z)"
          )
          if ($changelog.Success) {
            # Drop the heading line; the release has its own title.
            $what = ($changelog.Value -split "`r?`n", 2)[1].Trim()
          } else {
            $previous = (git tag --list 'v*' --sort=-v:refname) | Where-Object { $_ -ne $tag } | Select-Object -First 1
            $range = if ($previous) { "$previous..HEAD" } else { 'HEAD' }
            Write-Host "No CHANGELOG section for $version - listing commits ($range)."
            $what = "### Changes`n`n" + ((git log $range --no-merges --pretty='- %s') -join "`n")
          }

          $smartScreen = if ('${{ steps.signing.outputs.enabled }}' -eq 'true') {
            'The installer is code-signed (free code signing provided by SignPath.io, certificate by SignPath Foundation).' +
            ' While the certificate builds reputation, SmartScreen may still ask: click **More info -> Run anyway**.'
          } else {
            'Windows SmartScreen may show "Windows protected your PC" (not code-signed yet): click **More info -> Run anyway**.'
          }
          $installer = Get-ChildItem apps/desktop/release/OmniCam-Setup-*.exe
          $sha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $notes = @(
            $what
            ''
            '---'
            ''
            "**New install:** download **OmniCam-Setup-$version.exe** below and run it."
            $smartScreen
            ''
            '**Already running OmniCam?** *Settings -> Check for updates* installs this version for you;'
            'the installer below does the same thing by hand.'
            ''
            'Setup, usage and troubleshooting: README.txt below, or the project README.'
            ''
            '**Verify the download** (optional):'
            ''
            "- SHA-256 of ``$($installer.Name)``: ``$sha256``"
            "  PowerShell: ``Get-FileHash .\$($installer.Name)``"
            '- Built by this repository''s GitHub Actions from the tagged commit, with a signed provenance attestation:'
            "  ``gh attestation verify $($installer.Name) --repo Orest-Z/OmniCam``"
          )
          Set-Content release-notes.md -Value $notes -Encoding utf8
          Write-Host ($notes -join "`n")

      - name: Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Creates the tag at this commit when the release comes from a push to main.
          target_commitish: ${{ github.sha }}
          name: OmniCam ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          # Published, not a draft: the in-app updater only sees published releases, and only the
          # newest one it is pointed at. latest.yml and the blockmap are what it reads - they have
          # to sit next to the .exe.
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/resources/docs/README.txt
