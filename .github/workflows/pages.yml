name: Site

# Publishes website/ to GitHub Pages, plus the README's screenshots and GIFs (docs/media) and the brand
# fonts (assets/brand), which stay where they are so there is one copy of each in the repository.
on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/media/**
      - assets/brand/fonts/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble
        run: |
          mkdir -p _site/fonts
          cp -r website/. _site/
          cp -r docs/media/. _site/
          cp assets/brand/fonts/*.woff2 _site/fonts/
          # index.html points at ../docs/media/ for a local preview; on the site the media sits beside it.
          sed -i 's#\.\./docs/media/##g' _site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
