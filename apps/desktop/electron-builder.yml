appId: com.omnicam.desktop
productName: OmniCam
copyright: Copyright © 2026 Orest-Z
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/phone
    to: phone
  - from: resources/native
    to: native
  - from: resources/icons
    to: icons
  - from: resources/docs
    to: docs
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/icon.ico
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  runAfterFinish: true
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: OmniCam
electronVersion: 44.5.0
# GitHub Releases feed for the in-app updater: makes electron-builder write latest.yml (CI attaches it
# to the release) and resources/app-update.yml (tells the installed app where to look). The dist
# script passes --publish never; CI uploads the files itself.
publish:
  provider: github
  owner: Orest-Z
  repo: OmniCam
