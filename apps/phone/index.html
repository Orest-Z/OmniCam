<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>OmniCam</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <video id="preview" autoplay playsinline muted></video>

      <div id="overlay" class="overlay">
        <div class="brand">
          <div class="logo">◉</div>
          <h1>OmniCam</h1>
          <p class="sub">Your phone is about to become a webcam for your computer.</p>
        </div>
        <button id="start" class="primary">Start camera</button>
        <p id="overlay-msg" class="msg"></p>
      </div>

      <div id="hud" class="hud" hidden>
        <div class="statusbar">
          <span id="status" class="pill">connecting…</span>
          <span id="trackinfo" class="pill dim"></span>
        </div>
        <div class="controls">
          <button id="flip" class="round" title="Switch camera" aria-label="Switch camera">
            <svg viewBox="0 0 24 24"><path d="M20 5h-3.2L15 3H9L7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-8 3a5 5 0 0 1 4.9 4H15l2.5 3 2.5-3h-1.6A7 7 0 0 0 12 6v2zm0 10a5 5 0 0 1-4.9-4H9L6.5 11 4 14h1.6a7 7 0 0 0 6.4 4v-2z"/></svg>
          </button>
          <button id="stop" class="round danger" title="Stop" aria-label="Stop">
            <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <button id="torch" class="round" title="Torch" aria-label="Torch" hidden>
            <svg viewBox="0 0 24 24"><path d="M6 2h12v4l-3 3v13H9V9L6 6V2zm2 2v1.2l3 3V22h2V8.2l3-3V4H8z"/></svg>
          </button>
          <select id="res" class="select" title="Resolution">
            <option value="720p">720p</option>
            <option value="1080p" selected>1080p</option>
            <option value="1080p60">1080p 60</option>
            <option value="4k">4K</option>
          </select>
        </div>
        <p id="hint" class="hint">Keep this page open. Lock screen or switching apps pauses the camera.</p>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
